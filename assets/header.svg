<svg viewBox="0 0 1280 350" width="1280" height="350" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="João Pedro Villas Boas de Carvalho · Analista de Sistemas Especialista na Claro · Backend, APIs e integrações">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1626"/>
      <stop offset="55%" stop-color="#080F1B"/>
      <stop offset="100%" stop-color="#050910"/>
    </linearGradient>
    <radialGradient id="hglowbg" cx="12%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#39D353" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hdots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.1" fill="#3CF0A0" opacity="0.05"/>
    </pattern>
    <linearGradient id="hneon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D353"/>
      <stop offset="55%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6EE7F9"/>
    </linearGradient>
    <linearGradient id="hline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D353"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="hglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hsoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="350" rx="20" fill="url(#hbg)"/>
  <rect x="0" y="0" width="1280" height="350" rx="20" fill="url(#hdots)"/>
  <rect x="0" y="0" width="1280" height="350" rx="20" fill="url(#hglowbg)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="348.5" rx="19.5" fill="none" stroke="#1B2A45" stroke-width="1.5"/>

  <g stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" opacity="0.45">
    <path d="M16 34 L16 16 L34 16"/>
    <path d="M1264 34 L1264 16 L1246 16"/>
    <path d="M16 316 L16 334 L34 334"/>
    <path d="M1264 316 L1264 334 L1246 334"/>
  </g>

  <!-- linha de varredura -->
  <rect x="16" width="1248" height="2" fill="#39D353" opacity="0.1">
    <animate attributeName="y" values="24;326;24" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.14;0" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- prompt -->
  <text x="72" y="88" font-family="'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace" font-size="19" font-weight="600">
    <tspan fill="#22D3EE">joao@github</tspan><tspan fill="#5B6B86">:</tspan><tspan fill="#39D353">~</tspan><tspan fill="#5B6B86">$</tspan><tspan fill="#93A4C3"> whoami</tspan><tspan fill="#39D353" dx="4">█<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan>
  </text>

  <!-- nome -->
  <text x="70" y="184" font-family="'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace" font-size="66" font-weight="800" letter-spacing="3" fill="url(#hneon)" filter="url(#hglow)">JOÃO CARVALHO</text>
  <text x="74" y="216" font-family="'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace" font-size="15" font-weight="500" letter-spacing="3.5" fill="#7C8CA8">JOÃO PEDRO VILLAS BOAS DE CARVALHO</text>

  <!-- risco de acento -->
  <rect x="74" y="236" width="300" height="2.5" rx="1.25" fill="url(#hline)" filter="url(#hsoft)"/>
  <circle cx="74" cy="237" r="3.6" fill="#6EE7F9" filter="url(#hglow)">
    <animate attributeName="cx" values="82;356;82" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- cargo -->
  <text x="74" y="274" font-family="'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace" font-size="20" font-weight="600" letter-spacing="1">
    <tspan fill="#C7D2E5">ANALISTA DE SISTEMAS ESPECIALISTA</tspan><tspan fill="#39D353">  //  </tspan><tspan fill="#8FA1BE">CLARO BRASIL</tspan>
  </text>

  <!-- chips -->
  <g font-family="'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace" font-size="13" font-weight="600">
    <g><rect x="72" y="300" width="88" height="27" rx="13.5" fill="#0B1524" stroke="#39D353" stroke-opacity="0.5"/><text x="116.0" y="317.5" text-anchor="middle" fill="#AEE6BE">Python</text></g>
    <g><rect x="172" y="300" width="97" height="27" rx="13.5" fill="#0B1524" stroke="#22D3EE" stroke-opacity="0.5"/><text x="220.5" y="317.5" text-anchor="middle" fill="#9EDFEE">FastAPI</text></g>
    <g><rect x="281" y="300" width="124" height="27" rx="13.5" fill="#0B1524" stroke="#22D3EE" stroke-opacity="0.5"/><text x="343.0" y="317.5" text-anchor="middle" fill="#9EDFEE">TypeScript</text></g>
    <g><rect x="417" y="300" width="88" height="27" rx="13.5" fill="#0B1524" stroke="#39D353" stroke-opacity="0.5"/><text x="461.0" y="317.5" text-anchor="middle" fill="#AEE6BE">Docker</text></g>
    <g><rect x="517" y="300" width="79" height="27" rx="13.5" fill="#0B1524" stroke="#22D3EE" stroke-opacity="0.5"/><text x="556.5" y="317.5" text-anchor="middle" fill="#9EDFEE">CI/CD</text></g>
  </g>

  <!-- radar -->
  <g transform="translate(1086,172)">
    <circle r="116" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.09"/>
    <circle r="80" fill="none" stroke="#39D353" stroke-width="1" stroke-opacity="0.14"/>
    <circle r="46" fill="none" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.2"/>
    <circle r="20" fill="none" stroke="#39D353" stroke-width="1.4">
      <animate attributeName="r" values="16;120;16" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.55;0;0.55" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
      <circle cx="80" cy="0" r="3.4" fill="#6EE7F9" filter="url(#hglow)"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="7s" repeatCount="indefinite"/>
      <circle cx="46" cy="0" r="2.5" fill="#39D353"/></g>
    <circle cx="116" cy="0" r="2.3" fill="#22D3EE" opacity="0.65"/>
    <circle cx="-80" cy="0" r="2.1" fill="#39D353" opacity="0.55"/>
    <circle cx="0" cy="-46" r="2.1" fill="#6EE7F9" opacity="0.55"/>
    <circle r="8" fill="#0A1322" stroke="#39D353" stroke-width="1.5"/>
    <circle r="4.4" fill="#39D353" filter="url(#hglow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
