<svg viewBox="0 0 1280 160" width="1280" height="160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="João Pedro Villas Boas de Carvalho · Analista de Sistemas Especialista · Claro Brasil · São Paulo, Brasil">
  <defs>
    <radialGradient id="fbg" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#0D1A2E"/>
      <stop offset="100%" stop-color="#05080F"/>
    </radialGradient>
    <linearGradient id="fneon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D353"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="ftrace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#39D353" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#39D353" stop-opacity="0"/>
    </linearGradient>
    <pattern id="fdots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#3CF0A0" opacity="0.05"/>
    </pattern>
    <filter id="fglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="160" rx="20" fill="url(#fbg)"/>
  <rect x="0" y="0" width="1280" height="160" rx="20" fill="url(#fdots)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="158.5" rx="19.5" fill="none" stroke="#1B2A45" stroke-width="1.5"/>

  <g stroke="#22D3EE" stroke-width="1.6" stroke-linecap="round" opacity="0.45">
    <path d="M20 36 L20 20 L36 20"/>
    <path d="M1260 36 L1260 20 L1244 20"/>
    <path d="M20 124 L20 140 L36 140"/>
    <path d="M1260 124 L1260 140 L1244 140"/>
  </g>

  <line x1="150" y1="46" x2="1130" y2="46" stroke="url(#ftrace)" stroke-width="1.4"/>
  <g fill="#39D353" opacity="0.5">
    <circle cx="150" cy="46" r="2.4"/><circle cx="450" cy="46" r="2"/>
    <circle cx="830" cy="46" r="2"/><circle cx="1130" cy="46" r="2.4"/>
  </g>
  <circle cy="46" r="3.4" fill="#6EE7F9" filter="url(#fglow)">
    <animate attributeName="cx" values="150;1130;150" dur="7s" repeatCount="indefinite"/>
  </circle>

  <text x="640" y="98" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace" font-size="25" font-weight="800" letter-spacing="3" fill="url(#fneon)" filter="url(#fglow)">JOÃO PEDRO VILLAS BOAS DE CARVALHO</text>
  <text x="640" y="126" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','Cascadia Code','Courier New',monospace" font-size="13.5" font-weight="500" letter-spacing="1.4" fill="#8FA1BE">Analista de Sistemas Especialista · Claro Brasil · São Paulo, Brasil</text>
</svg>
